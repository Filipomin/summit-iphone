
name: Vytvorit SUMMIT IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Stahnout soubory
        uses: actions/checkout@v4

      - name: Pripravit Xcode
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Sestavit aplikaci
        run: |
          set -euo pipefail
          xcodebuild \
            -project SUMMIT.xcodeproj \
            -scheme SUMMIT \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

          APP="$PWD/build/Build/Products/Release-iphoneos/SUMMIT.app"
          test -f "$APP/Info.plist"
          test -f "$APP/Web/index.html"
          mkdir -p Payload
          cp -R "$APP" Payload/SUMMIT.app
          /usr/bin/zip -qry SUMMIT.ipa Payload

      - name: Ulozit IPA
        uses: actions/upload-artifact@v4
        with:
          name: SUMMIT-IPA
          path: SUMMIT.ipa
          if-no-files-found: error
