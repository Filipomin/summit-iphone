name: SUMMIT
options:
  bundleIdPrefix: cz.summitjournal
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: 1,2
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: 'NO'
targets:
  SUMMIT:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
    - path: SUMMIT/Source
    - path: SUMMIT/Assets.xcassets
    - path: Web
      type: folder
      buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.summitjournal.personal
        INFOPLIST_FILE: SUMMIT/Info.plist
        PRODUCT_NAME: SUMMIT
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: 'NO'
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
