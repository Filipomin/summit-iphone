async function sendChat(q) {

  try {

<script>
/* SUMMIT JOURNAL 3.0 — operates on original S collections, never migrates/deletes old data */
(()=>{
'use strict';
const V3_KEY='summit-journal-v3';
let extra={favorites:[],expeditions:{},tracks:[]};
try {const a=JSON.parse(localStorage.getItem(V3_KEY)||'null');if(a&&typeof a==='object')extra={favorites:Array.isArray(a.favorites)?a.favorites:[],expeditions:a.expeditions&&typeof a.expeditions==='object'?a.expeditions:{},tracks:Array.isArray(a.tracks)?a.tracks:[]};}catch(e){}
let explorer='catalog',filterQuery='',filterRegion='all',filterAlt='all',filterFav=false,visibleCount=18,mapOnline=false,onlineMap=null,mapScriptPromise=null;
let modalPeak='',modalPeakTab='overview',modalRouteIndex=0,modalPlanId='',modalPlanTab='overview',selectedTrackId='',currentOnlineMarkers=[];
const E=s=>esc(s), findPeak=n=>PRESETS.find(x=>x.k==='peak'&&norm(x.n)===norm(n)), peakList=()=>PRESETS.filter(x=>x.k==='peak');
const pageSize=18;
function persist(){try{localStorage.setItem(V3_KEY,JSON.stringify(extra));return true;}catch(e){toast('Úložiště je plné. Stáhni si zálohu a zkus odstranit velké GPX.');return false;}}
function chosenTrack(){return extra.tracks.find(t=>t.id===selectedTrackId)||null;}
function isFav(n){return extra.favorites.some(v=>norm(v)===norm(n));}
function toggleFav(n){extra.favorites=isFav(n)?extra.favorites.filter(v=>norm(v)!==norm(n)):[...extra.favorites,n];persist();}
function getMeta(id){const x=extra.expeditions[id]||{},p=S.plans.find(z=>z.id===id);return Object.assign({routeName:p?.routeName||'',hours:p?.tripHours||8,people:p?.people||2,weather:p?.heat==='hot'?'hot':'normal',transport:'',lodging:'',costs:[],days:[],bailout:p?.bailout||'',turnTime:p?.turnTime||'',emergencyContact:p?.emergencyContact||'',trackId:''},x);}
function setMeta(id,patch){extra.expeditions[id]=Object.assign({},getMeta(id),patch);persist();}
function getRoute(p){return (ROUTE_INFO[p?.n]||[])[modalRouteIndex]||null;}
function photo(n,h=180){return mtnVisual(n,findPeak(n)?.alt||0,h);}
function label(t){return t==='planned'?'Aktivní':t==='dream'?'Sen':'Dokončeno';}
function fnum(n){return Number(n||0).toLocaleString('cs-CZ');}
function getBadge(p){return p.alt>=4000?'4 000+ m':p.c?.split(' / ')[0]||'Vrchol';}
function nav(){const links=[['home','Domů','home'],['explore','Hory','map'],['plans','Expedice','flag'],['vision','Vize','star'],['log','Deník','book']];return links.map(([k,l,i])=>'<button type="button" data-v3="nav" data-target="'+k+'" '+((tab===k||(k==='explore'&&tab==='map'))?'aria-current="page"':'')+'>'+ic(i,20)+'<span>'+l+'</span></button>').join('');}
function head(){return '<div class="v3-head"><div class="v3-mark"><div class="v3-logo">⌃</div><div class="v3-brand">SUMMIT <small>MOUNTAIN JOURNAL · 6.0</small></div></div><div class="v3-topactions"><button type="button" class="v3-iconbtn" data-v3="search-open" title="Hledat horu">'+ic('search',17)+'<span>Hory</span></button><button type="button" class="v3-iconbtn v4-profile-btn" data-v3="nav" data-target="profile" title="Profil a nastavení">'+ic('user',17)+'<span>Profil</span></button></div></div>'; }

function loadMaplibre(){if(window.maplibregl)return Promise.resolve(window.maplibregl);if(mapScriptPromise)return mapScriptPromise;mapScriptPromise=new Promise((res,rej)=>{const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css';document.head.appendChild(css);const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js';s.onload=()=>window.maplibregl?res(window.maplibregl):rej(Error('Nedostupná mapová knihovna'));s.onerror=()=>rej(Error('Knihovna není dostupná offline'));document.head.appendChild(s);setTimeout(()=>rej(Error('Vypršel čas načítání online mapy')),12000);});return mapScriptPromise;}

function foodCalc(m){const hours=Math.min(240,Math.max(1,Number(m.hours)||8)),people=Math.min(20,Math.max(1,Number(m.people)||1)),rate=m.weather==='hot'?0.75:m.weather==='cold'?0.35:0.5;const water=hours*people*rate;const kcal=hours*people*250;return '<b>Orientační plán zásob pro '+people+' os.</b><p>Voda: zhruba <b>'+water.toFixed(1)+' l celkem</b> při '+Math.round(rate*1000)+' ml/os./h. Neznamená to nutnost vše nést: ověř spolehlivé doplnění, filtraci a rezervu.</p><p>Energie během aktivity: orientačně <b>'+fnum(kcal)+' kcal pro skupinu</b> (250 kcal/os./h); jde o hrubou plánovací pomůcku, ne individuální doporučenou dávku.</p>';}

function fillKit(){const p=S.plans.find(x=>x.id===modalPlanId);if(!p)return;const route=(ROUTE_INFO[p.name]||[]).find(x=>x.n===getMeta(p.id).routeName);const base=route?.gear||[];if(!base.length)return toast('Vyber nejdřív ověřenou trasu.');const have=new Set((p.gear||[]).map(x=>norm(x.t)));let n=0;p.gear=p.gear||[];base.forEach(t=>{if(!have.has(norm(t))){p.gear.push({t,d:false});have.add(norm(t));n++;}});save('plans',p.id,p);renderPlanModal();toast('Přidáno '+n+' položek vybavení.');}
function fillSafety(){const p=S.plans.find(x=>x.id===modalPlanId);if(!p)return;const a=['Ověřit počasí a výstrahy', 'Ověřit uzávěry a aktuální stav výstupové trasy','Zvolit sestup a ústupovou trasu','Stanovit nejzazší čas obratu a rezervu','Zkontrolovat zkušenosti a vybavení celé skupiny','Odevzdat kontaktní osobě plán návratu'];let n=0;const h=new Set((p.items||[]).map(x=>norm(x.t)));p.items=p.items||[];a.forEach(t=>{if(!h.has(norm(t))){p.items.push({t,d:false});n++;}});save('plans',p.id,p);renderPlanModal();toast('Přidáno '+n+' kontrol.');}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2200);}
function openBackup(){openSheet('<div class="v3-row-actions" style="justify-content:flex-end;margin:0 0 10px"><button class="v3-sheetbtn secondary" data-v3="modal-close">Zavřít ×</button></div><div class="v3-sheet-header"><div class="v3-eyebrow">Nastavení / ochrana dat</div><h2>Záloha a offline režim</h2></div><div class="v3-routebox"><h3>Kompletní záloha</h3><p>Exportuje původní výstupy, plány, vize, průvodce a fotografie i nové oblíbené vrcholy, detaily expedic a importované GPX trasy.</p><div class="v3-row-actions"><button class="v3-sheetbtn" data-v3="backup-export">↓ Stáhnout JSON</button><button class="v3-sheetbtn secondary" data-v3="backup-import">↑ Obnovit JSON</button></div><p>Import nahradí současné lokální záznamy pouze po potvrzení. Před importem si stáhni novou zálohu.</p></div><div class="v3-routebox"><h3>Offline funkce</h3><p>Deník, katalog vrcholů, vlastní GPX trasy, plány i orientační mapa pracují bez internetu. Fotografie, online mapový podklad a externí weby bez internetu nemusí fungovat.</p><p>Webová verze přes HTTPS se může nainstalovat na plochu telefonu. První spuštění musí být online.</p><p class="v3-muted" id="v3-online-indicator">'+(navigator.onLine?'🟢 Připojeno k internetu':'⚪ Offline')+'</p></div><div class="v3-routebox"><h3>Bezpečné uložení</h3><p>Data zůstávají na tomto zařízení a v této webové adrese. Přechod na jinou doménu nebo vymazání prohlížeče může data odstranit. Doporučujeme pravidelné exporty.</p></div>');}
function exportEverything(){const payload={format:'summit-journal',version:3,exportedAt:new Date().toISOString(),data:Object.fromEntries(COLS.map(k=>[k,S[k]])),extras:extra};download('summit-zaloha-'+today()+'.json',JSON.stringify(payload,null,2),'application/json');toast('Kompletní záloha vytvořena.');}
async function importEverything(file){if(store.mode==='db'){toast('Tento import je dostupný pouze pro lokální úložiště.');return;}if(!file||file.size>25*1024*1024)return toast('Příliš velká záloha nebo žádný soubor.');try{const parsed=JSON.parse(await file.text());const d=parsed.data||parsed;if(!d||!COLS.every(k=>Array.isArray(d[k])))throw Error('Soubor nemá správnou strukturu dat.');for(const k of COLS)if(d[k].length>20000||!d[k].every(x=>x&&typeof x==='object'&&typeof x.id==='string'))throw Error('Neplatná kolekce '+k);if(!confirm('OBNOVIT ZÁLOHU? Současné lokální záznamy budou nahrazeny. Zruš, pokud nemáš vlastní aktuální zálohu.'))return;const backupOld=JSON.stringify(Object.fromEntries(COLS.map(k=>[k,S[k]]))),backupMeta=JSON.stringify(extra);try{COLS.forEach(k=>S[k]=d[k]);if(parsed.extras){const a=parsed.extras;extra={favorites:Array.isArray(a.favorites)?a.favorites:[],expeditions:a.expeditions&&typeof a.expeditions==='object'?a.expeditions:{},tracks:Array.isArray(a.tracks)?a.tracks:[]};}lsSave();if(!persist())throw Error('Nová data se nevešla do úložiště.');}catch(err){const old=JSON.parse(backupOld);COLS.forEach(k=>S[k]=old[k]);extra=JSON.parse(backupMeta);lsSave();persist();throw err;}closeSheet();render();toast('Záloha byla obnovena.');return true;}catch(e){toast('Import selhal: '+e.message);}}
function dist(a,b){const toRad=Math.PI/180,x=(b[0]-a[0])*toRad,y=(b[1]-a[1])*toRad;const k=Math.sin(x/2)**2+Math.cos(a[0]*toRad)*Math.cos(b[0]*toRad)*Math.sin(y/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(k)));}
async function importGpx(file){if(!file||file.size>8*1024*1024){toast('GPX nesmí být větší než 8 MB.');return;}try{const text=await file.text(),xml=new DOMParser().parseFromString(text,'application/xml');if(xml.querySelector('parsererror'))throw Error('Neplatné XML v GPX.');const all=[...xml.getElementsByTagName('*')];const pts=all.filter(e=>['trkpt','rtept'].includes(e.localName));if(!pts.length)throw Error('Žádné body trasy (trkpt / rtept).');if(pts.length>30000)throw Error('Příliš mnoho bodů GPX (max. 30 000).');const parsed=[];for(const el of pts){const lat=Number(el.getAttribute('lat')),lon=Number(el.getAttribute('lon'));if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)continue;const ele=[...el.children].find(c=>c.localName==='ele');const h=ele&&ele.textContent?.trim()?Number(ele.textContent):null;parsed.push([lat,lon,Number.isFinite(h)?h:null]);}if(parsed.length<2)throw Error('Trasa musí mít aspoň dva souřadnicové body.');let km=0,gain=0,loss=0;for(let i=1;i<parsed.length;i++){const step=dist(parsed[i-1],parsed[i]);if(step>3)continue;km+=step;if(Number.isFinite(parsed[i][2])&&Number.isFinite(parsed[i-1][2])){const change=parsed[i][2]-parsed[i-1][2];if(Math.abs(change)>=3){if(change>0)gain+=change;else loss-=change;}}}const stride=Math.max(1,Math.ceil(parsed.length/2600));const simple=parsed.filter((p,i)=>i%stride===0||i===parsed.length-1);const track={id:newId(),name:file.name.replace(/\.gpx$/i,'').slice(0,90),km,gain,loss,count:parsed.length,points:simple};extra.tracks.push(track);selectedTrackId=track.id;if(!persist()){extra.tracks.pop();throw Error('Nedostatek místa v prohlížeči.');}if(!['explore','map'].includes(tab))goto('explore');explorer='map';mapOnline=false;render();toast('GPX načteno: '+track.km.toFixed(1)+' km · '+track.count+' bodů.');}catch(e){toast('Import GPX selhal: '+e.message);}}

const v4BaseImport=importEverything;
importEverything=async function(file){if(!file)return;let prefs=null;try{const parsed=JSON.parse(await file.text());prefs=parsed.preferences&&typeof parsed.preferences==='object'?parsed.preferences:null;}catch(e){}const restored=await v4BaseImport(file);if(restored&&prefs){v4=Object.assign(v4,{name:String(prefs.name||'').slice(0,60),bio:String(prefs.bio||'').slice(0,300),theme:palette[prefs.theme]?prefs.theme:'forest',accent:/^#[0-9a-fA-F]{6}$/.test(prefs.accent||'')?prefs.accent:'',customRoutes:prefs.customRoutes&&typeof prefs.customRoutes==='object'&&!Array.isArray(prefs.customRoutes)?prefs.customRoutes:{}});v4Write();v4Theme();render();}};
function v4CleanConfig(){return cloudConfig.url.replace(/\/$/,'');}
function v4Headers(auth){return {'Content-Type':'application/json',apikey:cloudConfig.key,...(auth&&cloudSession?.access_token?{Authorization:'Bearer '+cloudSession.access_token}:{})};}
async function v4Api(path,body=null,method='POST',auth=false){if(!cloudConfig.url||!cloudConfig.key)throw Error('Nejdřív nastav Supabase URL a publishable key v profilu.');let resp=await fetch(v4CleanConfig()+path,{method,headers:v4Headers(auth),body:body?JSON.stringify(body):undefined});let out;try{out=await resp.json();}catch(e){out={};}if(!resp.ok)throw Error(out.msg||out.error_description||out.message||out.error||'Server odpověděl '+resp.status);return out;}
function v4StoreSession(data){cloudSession={access_token:data.access_token,refresh_token:data.refresh_token,user:data.user||cloudSession?.user||null,expires_at:Date.now()+((Number(data.expires_in)||3600)*1000)};localStorage.setItem(V4_SESSION_KEY,JSON.stringify(cloudSession));}
async function v4Refresh(){if(!cloudSession)return false;if(cloudSession.expires_at>Date.now()+90000)return true;try{const d=await v4Api('/auth/v1/token?grant_type=refresh_token',{refresh_token:cloudSession.refresh_token});v4StoreSession(d);return true;}catch(e){cloudSession=null;localStorage.removeItem(V4_SESSION_KEY);return false;}}
async function v4Login(signup){if(v4Busy)return;const email=$('v4-email')?.value.trim().toLowerCase(),password=$('v4-password')?.value||'';if(!email||!email.includes('@')||password.length<6){toast('Zadej platný e-mail a heslo s alespoň 6 znaky.');return;}v4Busy=true;try{const d=await v4Api(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{email,password});if(d.access_token){v4StoreSession(d);toast('Úspěšně přihlášeno.');render();}else if(signup){toast('Účet vytvořen. Pokud přijde potvrzovací e-mail, nejdřív ho potvrď a pak se přihlas.');}else throw Error('Přihlášení nevrátilo platnou relaci.');}catch(e){toast('Přihlášení: '+e.message);}finally{v4Busy=false;}}
async function v4Recover(){const email=$('v4-email')?.value.trim();if(!email)return toast('Nejdřív vyplň e-mail.');try{await v4Api('/auth/v1/recover',{email});toast('Pokud účet existuje, e-mail s obnovením hesla byl odeslán.');}catch(e){toast('Reset hesla selhal: '+e.message);}}
async function v4Logout(){try{if(cloudSession)await v4Api('/auth/v1/logout',null,'POST',true);}catch(e){}cloudSession=null;localStorage.removeItem(V4_SESSION_KEY);render();toast('Odhlášeno. Lokální data zůstala zachována.');}
async function v4Sync(up){if(v4Busy)return;if(!await v4Refresh()){toast('Přihlášení vypršelo, přihlas se znovu.');render();return;}if(!navigator.onLine)return toast('Synchronizace vyžaduje internet.');v4Busy=true;try{if(up){if(!confirm('Opravdu nahrát aktuální místní deník do cloudu? Přepíšeš předchozí cloudovou zálohu svého účtu.'))return;const out=await fetch(v4CleanConfig()+'/rest/v1/user_snapshots?on_conflict=user_id',{method:'POST',headers:{...v4Headers(true),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:cloudSession.user.id,payload:v4Package(),updated_at:new Date().toISOString()})});if(!out.ok)throw Error((await out.text()).slice(0,180)||String(out.status));toast('Celá záloha úspěšně uložena v cloudu.');}else{const out=await fetch(v4CleanConfig()+'/rest/v1/user_snapshots?user_id=eq.'+encodeURIComponent(cloudSession.user.id)+'&select=payload,updated_at',{headers:v4Headers(true)});if(!out.ok)throw Error((await out.text()).slice(0,180)||String(out.status));const a=await out.json();if(!a.length)return toast('Účet zatím nemá cloudovou zálohu.');const payload=a[0].payload;if(!payload?.data||!COLS.every(k=>Array.isArray(payload.data[k])))throw Error('Neplatná cloudová záloha.');if(!confirm('Nahradit místní deník cloudovou zálohou ze dne '+a[0].updated_at+'? Předtím doporučujeme exportovat místní data.'))return;let clone=structuredClone(v4Package());try{COLS.forEach(k=>S[k]=payload.data[k]);lsSave();if(payload.extras){extra=payload.extras;persist();}if(payload.preferences){v4=Object.assign(v4,payload.preferences);v4Write();v4Theme();}render();toast('Záloha byla načtena z cloudu.');}catch(err){COLS.forEach(k=>S[k]=clone.data[k]);extra=clone.extras;v4=clone.preferences;lsSave();persist();v4Write();throw err;}}}catch(e){toast('Cloud: '+e.message+' · Zkontroluj SQL nastavení.');}finally{v4Busy=false;}}
function v4FooterApply(){const view=$('view');if(view&&!view.querySelector('.v4-footer'))view.insertAdjacentHTML('beforeend',v4Footer());}

for(const spec of V6_DOCUMENTED){
  const arr=ROUTE_INFO[spec.peak]||(ROUTE_INFO[spec.peak]=[]);
  if(!arr.some(r=>norm(r.n)===norm(spec.n))){const row={...spec};delete row.peak;arr.push(row);}

const V6_EVIDENCE={verified:{text:'Trasa doložená zdrojem',css:'v6-trusted'},reference:{text:'Regionální podklad',css:'v6-reference'},lead:{text:'Návrh trasy k ověření',css:'v6-unverified'}};
function v6Level(r){return r?.evidence||((r?.link&&r?.publisher)?'verified':'lead');}
function v6Status(r){return V6_EVIDENCE[v6Level(r)]||V6_EVIDENCE.lead;}
function v6RoadHints(r){const hints={hiking:'Za sucha může jít o pěší trasu; zima, námraza nebo sníh zásadně mění její charakter.',rock:'Ověř pevnost skály, expozici, možné jištění, sestup a zkušenosti celé skupiny.',glacier:'Nutná znalost pohybu v lanovém družstvu a záchrany z trhlin. Sněhové mosty a seraky mohou být nestabilní.',ferrata:'Ověř stav ocelového zajištění a zda je pro konkrétní úseky potřebná ferratová výbava. Pozor na bouřky.',ice:'Prověř lavinovou situaci, stabilitu sněhu, podmínky v ledu a vlastní schopnost zajištění.'};return hints[r?.kind]||hints.hiking;}
function v6Lookup(p){return v5RouteSearch(p);}
function v6SrcLink(r,p){const url=r?.link||v6Lookup(p);return '<a class="v6-src" target="_blank" rel="noopener noreferrer" href="'+E(url)+'">'+(r?.link?'Otevřít původní zdroj':'Dohledat aktuální průvodce')+' ↗</a>';}
function v6RouteCard(p,r,i){const st=v6Status(r),isLead=v6Level(r)==='lead',selected=modalRouteIndex===i,source=r.publisher||'Zdroj zatím neuveden';return '<article class="v6-route-card '+(selected?'is-selected ':'')+st.css+'"><div class="v6-route-card-head"><div><span class="v6-status">'+(isLead?'○':'✓')+' '+E(st.text)+'</span><h3>'+E(r.n)+'</h3></div><span class="v6-route-no">'+String(i+1).padStart(2,'0')+'</span></div><div class="v6-route-stat"><div><span>Nástup</span><strong>'+E(r.from||'Ověř u zdroje')+'</strong></div><div><span>Obtížnost konkrétní cesty</span><strong>'+E(isLead?'Zatím neověřená':r.grade||'Bez klasifikace')+'</strong></div><div><span>Typ terénu</span><strong>'+E(V6_GUIDE_LABELS[r.kind]||'Vyžaduje ověření')+'</strong></div></div><p class="v6-route-desc">'+E(r.note||v6RoadHints(r))+'</p><p class="v6-route-risk"><b>Na co si dát pozor:</b> '+E(v6RoadHints(r))+'</p><details class="v6-equipment"><summary>Výbava k prověření <span>⌄</span></summary><div class="v6-kitlist">'+(r.gear||[]).map(x=>'<span>'+E(x)+'</span>').join('')+'</div><small>'+(isLead?'Jen orientační seznam podle předpokládaného typu terénu, nikoliv potvrzené požadavky této cesty.':'Orientační výbava podle charakteru trasy; úplnost, kompetence a aktuální podmínky ověř u zdroje.')+'</small></details><div class="v6-route-actions"><button class="v3-sheetbtn '+(selected?'':'secondary')+'" data-v3="route" data-index="'+i+'">'+(selected?'✓ Vybraná cesta':'Vybrat cestu')+'</button>'+v6SrcLink(r,p)+'</div><p class="v6-route-credit">'+E(source)+(r.checked?' · přehled zdrojů z '+E(r.checked):'')+'</p></article>';}
function v6Badges(p){const a=ROUTE_INFO[p.n]||[];const documented=a.filter(r=>v6Level(r)==='verified').length;const regional=a.filter(r=>v6Level(r)==='reference').length;return {documented,regional,unverified:a.length-documented-regional,all:a.length};}
function v6PeakRoutes(p){const a=ROUTE_INFO[p.n]||[],q=v6Badges(p);const body=a.map((r,i)=>v6RouteCard(p,r,i)).join('');const tips=v5TrailUrls(p).map(([title,url])=>'<a href="'+E(url)+'" target="_blank" rel="noopener noreferrer">'+E(title)+' ↗</a>').join('');return '<section class="v6-routes"><div class="v6-route-summary"><span class="v6-eyebrow">PRŮVODCE VÝSTUPY</span><h3>Výstupové cesty · '+E(p.n)+'</h3><p>'+q.all+' pojmenovan'+(q.all===1?'á varianta':'é varianty')+' · '+q.documented+' se zdrojem · '+q.unverified+' k ověření</p><div class="v6-trust-hint"><strong>Jak číst údaje:</strong> symbol ✓ znamená dohledaný popis cesty. Označení ○ znamená <strong>pracovní tip, ne ověřený výstup ani navigaci</strong>. Náročnost vrcholu v katalogu se nemusí shodovat s obtížností dané trasy.</div></div><div class="v6-route-grid">'+body+'</div><details class="v6-route-more"><summary>Mapy, značené stezky, moje vlastní trasy <span>⌄</span></summary><div class="v6-map-links">'+tips+'</div><div class="v6-map-disclaimer">Stezky v okolí hory nejsou automaticky výstupovou trasou na vrchol. Před cestou ověř uzávěry, podmínky a možnost bezpečného sestupu.</div><div class="v6-map-nearby"><div class="v6-more-head">Komunitní mapované stezky <button class="v5-mini-btn" data-v5="reload-routes" data-peak="'+E(p.n)+'">Obnovit ↻</button></div><div id="v5-trail-results" class="v5-small">Načítání online mapových relací…</div></div>'+v4RouteSources(p)+'</details></section>';}
const v6PrevMountainDetail=mountainDetailSection;
mountainDetailSection=function(p){
 if(modalPeakTab==='routes')return v6PeakRoutes(p);
 const r=getRoute(p),v6r=v6Status(r),isLead=v6Level(r)==='lead';
 if(modalPeakTab==='overview'){
  const counts=v6Badges(p),safeText=counts.documented?'Zdrojem doložené varianty najdeš v kartě Trasy.':'U této hory je zatím k dispozici návrh výstupové varianty k ověření.';
  return '<div class="v6-overview"><div class="v6-over-stats"><div><small>VRCHOL</small><strong>'+fnum(p.alt)+' m</strong></div><div><small>OBLAST</small><strong>'+E(p.c||'—')+'</strong></div><div><small>TRASY</small><strong>'+counts.all+'</strong></div></div><p>'+E(p.d||'')+'</p><div class="v6-over-feature"><span class="v6-eyebrow">DOPORUČENÝ POSTUP</span><h3>Nejdřív vyber trasu, potom připrav výbavu</h3><p>'+safeText+' Obtížnost i výbavu posuzuj pro danou cestu a podmínky, ne pouze podle názvu hory.</p><button class="v3-sheetbtn" data-v3="modal-tab" data-target="routes">Prohlédnout výstupové cesty →</button></div><button class="v3-sheetbtn secondary" data-v3="peak-map">Zobrazit vrchol na mapě</button></div>';
 }
 if(modalPeakTab==='gear')return '<section class="v6-gear-panel"><div class="v6-gear-title"><span class="v6-eyebrow">VÝBAVA PODLE TRASY</span><h3>'+E(r?.n||'Nejprve vyber trasu')+'</h3><p>'+E(r?V6_GUIDE_LABELS[r.kind]||'Horský výstup':'Žádná trasa není vybrána')+' · '+E(v6r.text)+'</p></div><div class="v6-alert">'+(isLead?'Tato varianta ještě nemá individuálně ověřenou klasifikaci. Výbava níže je jen typová pomůcka, nikoli potvrzené požadavky pro výstup.':'Ani zdrojově doložená cesta neurčuje bezpečnost pro dnešní podmínky. Ověř počasí, sníh, led, skalní úseky, jištění, sestup a dovednosti.')+'</div><div class="v6-kit-grid">'+(r?.gear||[]).concat(['Voda + možnost bezpečného doplnění','Jídlo + energetická rezerva','Lékárnička a nouzové kontakty','Offline mapa a čelovka']).map(x=>'<div class="v6-kit-item">☐ '+E(x)+'</div>').join('')+'</div><p class="v6-small">Vybavení do skutečného checklistu uložíš v expedičním plánu. Samotný seznam nestačí bez potřebných dovedností.</p><div class="v6-route-actions"><button class="v3-sheetbtn" data-v3="plan-from-peak">+ Připravit expedici</button><button class="v3-sheetbtn secondary" data-v3="modal-tab" data-target="routes">Změnit trasu</button></div></section>';
 if(modalPeakTab==='safety')return '<div class="v6-alert"><b>Bezpečnostní rozhodnutí děláš na místě.</b> Zkontroluj počasí, sezónní uzávěry, stav zajištění, kondici skupiny, aklimatizaci a návratovou rezervu. Trasu nikdy nevyhodnocuj jako bezpečnou pouze podle aplikace.</div>'+v6PrevMountainDetail(p);
 return v6PrevMountainDetail(p);
};
const v6PrevMcard=mcard;
mcard=function(p){const s=v6Badges(p),l=s.documented?'Zdrojové trasy: '+s.documented:s.regional?'Regionální podklady':'Pracovní varianta · ověřit';const cls=s.documented?'good':s.regional?'mid':'draft';let h=v6PrevMcard(p);return h.replace('</article>','<div class="v6-cardline '+cls+'"><span>'+(s.documented?'✓':'○')+' '+E(l)+'</span><b>'+s.all+' cesta'+(s.all===1?'':'/y')+' →</b></div></article>');};

// The default gets an indigo-toned graphite visual treatment; user's saved custom colours still work.
palette.glacier.accent='#a8b6ff';palette.glacier.name='Midnight Blue';
if(!v4.theme||!palette[v4.theme])v4.theme='glacier';
try{v4Theme();}catch(e){}

if(tab==='map'){tab='explore';explorer='map';}render();
})();
